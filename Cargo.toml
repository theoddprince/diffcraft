[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]
default-members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"
repository = "https://github.com/theoddprince/diffcraft"
authors = ["The DiffCraft contributors"]

[workspace.dependencies]
diffcraft-core = { path = "crates/diffcraft-core" }
diffcraft-session = { path = "crates/diffcraft-session" }
diffcraft-report = { path = "crates/diffcraft-report" }
diffcraft-ui = { path = "crates/diffcraft-ui" }

thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
rayon = "1"
walkdir = "2"
globset = "0.4"
crc32fast = "1"
sha2 = "0.10"
encoding_rs = "0.8"
chardetng = "0.1"
regex = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "tiff", "ico", "tga"] }
trash = "5"
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "glow", "persistence", "accesskit", "wayland", "x11"] }
egui = "0.36"
rfd = "0.17"
log = "0.4"
env_logger = "0.11"
tempfile = "3"
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"
unreachable = "deny"

[profile.release]
lto = "thin"
codegen-units = 4
panic = "unwind"
strip = "debuginfo"

[profile.dev.package."*"]
opt-level = 2
